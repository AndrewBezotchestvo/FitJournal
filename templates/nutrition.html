{% extends 'base.html' %}{% block content %}<h1>Дневник питания</h1><div class="card"><form method="post" class="fields"><div><label>Дата</label><input type="date" name="done_on" value="{{today}}" required></div><div><label>Продукт / блюдо</label><input name="name" required></div><div><label>Масса, г</label><input type="number" step="1" min="0" name="grams"></div><div><label>Ккал (за порцию)</label><input type="number" step="1" min="0" name="calories" required></div><div><label>Белок, г (за порцию)</label><input type="number" step="0.1" min="0" name="protein" required></div><button>Добавить</button></form><small>Калории и белок вводятся за съеденную порцию, а не за 100 г.</small></div><div class="card scroll"><table><tr><th>Дата</th><th>Блюдо</th><th>Граммы</th><th>Ккал</th><th>Белок</th><th></th></tr>{% for r in rows %}<tr><td>{{r.done_on}}</td><td>{{r.name}}</td><td>{{r.grams or '—'}}</td><td>{{r.calories}}</td><td>{{r.protein}}</td><td><form method="post"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{r.id}}"><button class="danger">×</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
