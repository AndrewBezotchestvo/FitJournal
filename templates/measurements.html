{% extends 'base.html' %}{% block content %}<h1>Вес, талия и сон</h1><div class="card"><form method="post" class="fields"><div><label>Дата</label><input type="date" name="done_on" value="{{today}}" required></div><div><label>Вес, кг</label><input type="number" step="0.1" min="1" name="weight"></div><div><label>Талия, см</label><input type="number" step="0.1" min="1" name="waist"></div><div><label>Сон, часов</label><input type="number" step="0.1" min="0" max="24" name="sleep"></div><div><label>Примечание</label><input name="notes"></div><button>Добавить замер</button></form></div><div class="card scroll"><table><tr><th>Дата</th><th>Вес</th><th>Талия</th><th>Сон</th><th>Примечание</th><th></th></tr>{% for r in rows %}<tr><td>{{r.done_on}}</td><td>{{r.weight or '—'}}</td><td>{{r.waist or '—'}}</td><td>{{r.sleep or '—'}}</td><td>{{r.notes or ''}}</td><td><form method="post"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{r.id}}"><button class="danger">×</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
