{% extends 'base.html' %}{% block content %}<h1>Графики прогресса</h1><div class="grid"><div class="card"><h2>Вес тела</h2><canvas id="weight"></canvas></div><div class="card"><h2>Талия</h2><canvas id="waist"></canvas></div><div class="card"><h2>Калории и белок</h2><canvas id="food"></canvas></div><div class="card"><h2>Кардио, минут</h2><canvas id="cardio"></canvas></div></div><div class="card"><h2>Рабочие веса</h2><label>Упражнение</label><select id="exercise" onchange="renderStrength()"></select><canvas id="strength"></canvas></div><p class="muted">Графики появятся после добавления записей. Для Chart.js требуется доступ к интернету (CDN).</p><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script>let data={},sc={};function chart(id,labels,datasets){if(sc[id])sc[id].destroy();sc[id]=new Chart(document.getElementById(id),{type:'line',data:{labels,datasets},options:{responsive:true,plugins:{legend:{display:datasets.length>1}},scales:{y:{beginAtZero:false}}}})}function series(arr,key,label){return {label,data:arr.map(x=>x[key]),borderWidth:2,tension:.2,spanGaps:true}}function renderStrength(){let n=document.getElementById('exercise').value;let a=data.strength.filter(x=>x.exercise_name===n);chart('strength',a.map(x=>x.done_on),[series(a,'weight','Вес, кг')])}fetch('/api/charts').then(r=>r.json()).then(d=>{data=d;chart('weight',d.measurements.map(x=>x.done_on),[series(d.measurements,'weight','Вес, кг')]);chart('waist',d.measurements.map(x=>x.done_on),[series(d.measurements,'waist','Талия, см')]);chart('food',d.food.map(x=>x.done_on),[series(d.food,'calories','Ккал'),series(d.food,'protein','Белок, г')]);chart('cardio',d.cardio.map(x=>x.done_on),[series(d.cardio,'minutes','Кардио, мин')]);let names=[...new Set(d.strength.map(x=>x.exercise_name))];document.getElementById('exercise').innerHTML=names.map(n=>`<option>${n.replaceAll('&','&amp;').replaceAll('<','&lt;')}</option>`).join('');renderStrength()}).catch(e=>document.querySelector('main').insertAdjacentHTML('beforeend','<p>Не удалось загрузить графики. Проверь подключение к интернету.</p>'))</script>{% endblock %}
