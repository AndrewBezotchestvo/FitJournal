{% extends 'base.html' %}{% block content %}<h1>Редактируемый план тренировок</h1>{% for d in range(1,8) %}<div class="card day"><h2>{{days[d-1]}}</h2>{% if d==7 %}<p>Отдых, лёгкая прогулка по желанию.</p>{% endif %}{% for e in ex if e.day==d %}<form method="post" class="fields"><input type="hidden" name="action" value="edit"><input type="hidden" name="id" value="{{e.id}}"><div><label>Упражнение</label><input name="name" value="{{e.name}}" required></div><div><label>День</label><select name="day">{% for k in range(1,7) %}<option value="{{k}}" {% if k==e.day %}selected{% endif %}>{{k}}</option>{% endfor %}</select></div><div><label>Подходы</label><input type="number" name="sets" min="1" max="15" value="{{e.sets}}" required></div><div><label>Повторения</label><input name="reps" value="{{e.reps}}" required></div><div><button>Сохранить</button></div></form><form method="post" style="margin:4px 0 18px"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{e.id}}"><button class="danger" onclick="return confirm('Удалить упражнение?')">Удалить</button></form>{% endfor %}</div>{% endfor %}<div class="card"><h2>Добавить упражнение</h2><form method="post" class="fields"><input type="hidden" name="action" value="add"><div><label>Название</label><input name="name" required></div><div><label>День</label><select name="day">{% for k in range(1,7) %}<option value="{{k}}">{{days[k-1]}}</option>{% endfor %}</select></div><div><label>Подходы</label><input type="number" name="sets" value="3" min="1" required></div><div><label>Повторения</label><input name="reps" value="8–12" required></div><button>Добавить</button></form></div>{% endblock %}
