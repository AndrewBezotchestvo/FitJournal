{% extends 'base.html' %}{% block content %}<h1>Записать тренировку</h1><form method="post" class="card"><div class="fields"><div><label>Дата</label><input type="date" name="done_on" value="{{today}}" required></div><div><label>День программы</label><select name="day" id="day" onchange="showDay()">{% for k in range(1,7) %}<option value="{{k}}">{{days[k-1]}}</option>{% endfor %}</select></div><div><label>Кардио</label><select name="cardio_kind"><option>Дорожка</option><option>Эллипс</option><option>Велотренажёр</option><option>Другое</option></select></div><div><label>Кардио, минут</label><input type="number" name="cardio_minutes" value="25" min="0" step="0.5"></div></div>{% for k in range(1,7) %}<section class="exercise-day {% if k!=1 %}hidden{% endif %}" data-day="{{k}}"><h2>{{days[k-1]}}</h2>{% for e in ex if e.day==k %}<div class="card"><strong>{{e.name}}</strong> <small>План: {{e.sets}} × {{e.reps}}</small>{% for n in range(1,e.sets+1) %}<div class="setrow"><div><label>Подход</label><input readonly value="{{e.name}}" tabindex="-1"></div><div><label>№</label><input readonly value="{{n}}"><input type="hidden" name="exercise_id" value="{{e.id}}" {% if k!=1 %}disabled{% endif %}><input type="hidden" name="set_number" value="{{n}}" {% if k!=1 %}disabled{% endif %}></div><div><label>Повторы</label><input type="number" name="reps" min="1" max="300" placeholder="10" {% if k!=1 %}disabled{% endif %}></div><div><label>Вес, кг</label><input type="number" name="weight" step="0.5" min="0" value="0" {% if k!=1 %}disabled{% endif %}></div></div>{% endfor %}</div>{% endfor %}</section>{% endfor %}<label>Заметки</label><textarea name="notes" rows="3" placeholder="Самочувствие, пульс, техника..."></textarea><p><button>Сохранить тренировку</button></p></form><script>function showDay(){let d=document.getElementById('day').value;document.querySelectorAll('.exercise-day').forEach(s=>{let active=s.dataset.day===d;s.classList.toggle('hidden',!active);s.querySelectorAll('input[name]').forEach(i=>i.disabled=!active)})}showDay()</script>{% endblock %}
